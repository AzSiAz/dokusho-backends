[package]
name = "sources"
version = "0.1.0"
edition = "2024"

[dependencies]
dokusho-core = { path = "../core" }
dokusho-clients = { path = "../clients" }

# Async
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# HTTP
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTML parsing
scraper = "0.18"
selectors = "0.25"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
chrono = { workspace = true }
tracing = { workspace = true }
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
regex = "1.10"
lazy_static = "1.4"
once_cell = "1.19"
strum = "0.27"
strum_macros = "0.27"

[dev-dependencies]
wiremock = { workspace = true }
tokio-test = "0.4"
